<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tmt.page — Take me to…</title>
  <meta name="description" content="Free short links. Paste a long URL, pick a name, and share tmt.page/your-name." />
  <meta name="theme-color" content="#141a17" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="tmt.page — Take me to…" />
  <meta property="og:description" content="Free short links. Paste a long URL, pick a name, and share tmt.page/your-name." />
  <meta property="og:url" content="https://tmt.page/" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9E%A1%EF%B8%8F</text></svg>" />
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
  <main>
    <h1>Take me to…</h1>
    <p class="lede">Free short links for anyone. Paste a long URL, pick a name, and share <code>tmt.page/your-name</code>.</p>

    <form id="create" novalidate>
      <label>
        Long URL
        <span class="field">
          <input id="url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="https://example.com/a/very/long/link" required />
        </span>
      </label>

      <label>
        Custom name <span class="muted">(optional)</span>
        <span class="field">
          <span class="prefix">tmt.page/</span>
          <input id="slug" name="slug" type="text" autocomplete="off" spellcheck="false" autocapitalize="none"
                 maxlength="64" placeholder="random" />
        </span>
        <span class="hint" id="slug-hint" aria-live="polite"></span>
      </label>

      <div><button class="btn" id="submit" type="submit">Shorten</button></div>
      <p class="error" id="error" role="alert"></p>
    </form>

    <section class="result" id="result" hidden aria-live="polite">
      <div class="short">
        <a id="short" href="#" target="_blank" rel="noopener"></a>
        <button class="btn ghost" id="copy" type="button">Copy</button>
      </div>
      <p class="dest">→ <span id="dest"></span></p>
    </section>

    <h2>Tools</h2>
    <ul class="tools">
      <li><a href="/camping/">Am I Warm? <span>/camping</span></a></li>
    </ul>

    <footer>
      Add <code>+</code> to any link (<code>tmt.page/name+</code>) to see where it goes before you click.
      Links are public and permanent. Abuse is disabled on report.
    </footer>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
